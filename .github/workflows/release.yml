name: Release

# Publishes the package to npm whenever a version tag (vX.Y.Z) is pushed.
# The published version is taken from the tag, so keep tags in sync with
# package.json (npm version v0.1.0 && git push --tags).
#
# Auth: npm trusted publishing (OIDC). npm automatically uses the GitHub
# Actions OIDC token because a trusted publisher is configured for this package
# on npmjs.com (Settings -> Trusted publishing -> GitHub Actions ->
# owner `jaggr2`, repo `cdk-cf-dns`, workflow `release.yml`, action `npm publish`).
# No npm token is used or required; provenance is generated automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Publish to npm
        run: npm publish --access public --provenance
